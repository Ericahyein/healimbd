name: Firebase Rules Emulator Verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/review-auth-and-public-summary'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/rules/**'
      - '.github/workflows/firebase_rules_test.yml'

jobs:
  rules-emulator-test:
    name: Run Firebase Emulator Rules Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Installation
        run: java -version

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Rules Testing Dependencies
        working-directory: ./tests/rules
        run: npm install

      - name: Execute Firebase Rules Unit Tests in Emulator
        run: |
          npx firebase-tools emulators:exec \
            --only firestore,storage \
            --project demo-healimbd-rules-test \
            "cd tests/rules && npm test"
