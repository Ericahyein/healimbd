name: Doctor Column AI Auto Publisher (Phase 1 Dry-Run Ready)

on:
  schedule:
    # 00:07 UTC = 09:07 KST (오전 1회차)
    - cron: '7 0 * * *'
    # 08:07 UTC = 17:07 KST (오후 2회차)
    - cron: '7 8 * * *'
  workflow_dispatch:
    inputs:
      test_qa_target:
        description: 'Dry-run QA 대상 선택 (auto: 로테이션 플래너, 특정 qaId 지정 시 해당 질환/토픽 강제 실행)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'qa-01-tic (소아 틱장애 / media-exposure)'
          - 'qa-02-tourette (뚜렛증후군 / parent-guidance)'
          - 'qa-03-adhd-child (소아 ADHD / child-impulsivity)'
          - 'qa-04-adhd-adult (성인 ADHD / adult-work-mistakes)'
          - 'qa-05-panic (공황장애 / sudden-palpitation)'
          - 'qa-06-anxiety (불안장애 / chronic-worry)'
          - 'qa-07-social-phobia (사회공포증 / presentation-anxiety)'
          - 'qa-08-sleep (만성 불면증 / early-awakening)'
          - 'qa-09-autonomic (자율신경실조증 / digestive-dizziness)'
          - 'qa-10-hyperhidrosis (다한증 / hands-feet-sweat)'
          - 'qa-11-ibs (과민성대장증후군 / morning-diarrhea)'
          - 'qa-12-syncope (미주신경성 실신 / subway-dizziness)'
          - 'qa-13-headache (만성 두통 / tension-headache)'
          - 'qa-14-dizziness (어지럼증 / chronic-dizziness)'
          - 'qa-15-depression (우울증 / burnout-lethargy)'
          - 'qa-16-ocd (강박증 / intrusive-thoughts)'
          - 'qa-17-separation-anxiety (소아 분리불안 / separation-anxiety)'
          - 'qa-18-night-terrors (소아 야경증 / night-terrors)'
          - 'qa-19-child-enuresis (소아 야뇨증 / child-enuresis)'
          - 'qa-20-fatigue (만성피로·번아웃 / brain-fog-fatigue)'
      force_publish:
        description: '강제 프로덕션 발행 여부 (기본값 false: Dry-run 미리보기만 수행)'
        required: false
        default: false
        type: boolean

concurrency:
  group: auto-column-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-column-job:
    runs-on: ubuntu-latest
    env:
      AUTO_COLUMN_ENABLED: ${{ vars.AUTO_COLUMN_ENABLED || 'false' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Node Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Korean Fonts for SVG Thumbnail Rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum fontconfig
          sudo fc-cache -f -v
          fc-match "Noto Sans CJK KR"

      - name: Execute Doctor Column Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PLANNER_MODEL: ${{ vars.OPENAI_PLANNER_MODEL || 'gpt-5.6-luna' }}
          OPENAI_WRITER_MODEL: ${{ vars.OPENAI_WRITER_MODEL || 'gpt-5.6-terra' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
          FORCE_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_publish) && 'true' || 'false' }}
          TEST_QA_TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_qa_target) || 'auto' }}
        run: node scripts/auto_column/index.js

      - name: Upload Dry-Run Artifacts (If Generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: column-dry-run-preview-${{ github.run_number }}
          path: auto_column_artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist QA Results History (Dry-Run Mode Only)
        if: always() && (env.AUTO_COLUMN_ENABLED != 'true' && (github.event_name != 'workflow_dispatch' || inputs.force_publish != true))
        run: |
          git config --global user.name "Healim QA Bot"
          git config --global user.email "bot@healim-bundang.com"
          # STRICT ALLOWLIST: 오직 auto_column_qa_results.json만 커밋하여 프로덕션 아티클 및 로테이션 오염 원천 차단
          git add data/auto_column_qa_results.json
          if git diff --staged --quiet; then
            echo "No QA results changes to commit."
          else
            QA_ID="${{ (github.event_name == 'workflow_dispatch' && inputs.test_qa_target) || 'auto' }}"
            git commit -m "chore(qa): record dry-run results for ${QA_ID} [skip ci]"
            git push origin main
          fi

      - name: Validate Hugo Static Build (Production Mode Only)
        if: env.AUTO_COLUMN_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish == true)
        run: hugo --minify -d public

      - name: Commit and Push to Main (Production Mode Only)
        if: env.AUTO_COLUMN_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish == true)
        run: |
          git config --global user.name "Healim Column Publisher Bot"
          git config --global user.email "bot@healim-bundang.com"

          # 1. Resolve published slug and title from the last history entry
          CURRENT_SLUG=$(node -e "const h=require('./data/auto_column_history.json'); if(h.length>0 && h[h.length-1].slug) console.log(h[h.length-1].slug.trim());")
          NEW_TITLE=$(node -e "const h=require('./data/auto_column_history.json'); if(h.length>0 && h[h.length-1].title) console.log(h[h.length-1].title.trim()); else console.log('new column');")

          if [ -z "$CURRENT_SLUG" ]; then
            echo "❌ Error: Could not determine CURRENT_SLUG from data/auto_column_history.json"
            exit 1
          fi

          ARTICLE_FILE="content/blog/${CURRENT_SLUG}.md"
          IMAGE_FILE="static/images/blog/${CURRENT_SLUG}.jpg"
          HISTORY_FILE="data/auto_column_history.json"

          # 2. Check existence of the exact expected files
          echo "Checking required production output files..."
          for f in "$ARTICLE_FILE" "$IMAGE_FILE" "$HISTORY_FILE"; do
            if [ ! -f "$f" ]; then
              echo "❌ Error: Expected file does not exist: $f"
              exit 1
            fi
            echo "  ✅ Found: $f"
          done

          # 3. Stage ONLY the exact allowlisted files
          git add "$ARTICLE_FILE" "$IMAGE_FILE" "$HISTORY_FILE"

          # 4. Strict Allowlist Verification via git diff --cached --name-only
          echo "Verifying staged files against strict allowlist..."
          STAGED_FILES=$(git diff --cached --name-only)

          if [ -z "$STAGED_FILES" ]; then
            echo "ℹ️ No changes staged to commit."
            exit 0
          fi

          FORBIDDEN_FOUND=0
          while IFS= read -r staged_file; do
            [ -z "$staged_file" ] && continue
            if [ "$staged_file" != "$ARTICLE_FILE" ] && [ "$staged_file" != "$IMAGE_FILE" ] && [ "$staged_file" != "$HISTORY_FILE" ]; then
              echo "❌ ALLOWLIST VIOLATION: Unexpected file staged: $staged_file"
              FORBIDDEN_FOUND=1
            else
              echo "  ✅ Staged file verified: $staged_file"
            fi
          done <<< "$STAGED_FILES"

          if [ $FORBIDDEN_FOUND -ne 0 ]; then
            echo "💥 Aborting commit due to allowlist violation. Unstaging all files."
            git reset
            exit 1
          fi

          # 5. Commit and Push
          git commit -m "auto(column): publish ${NEW_TITLE}"
          git push origin main
