<!-- Member Login & Registration Modal (의료법 준수 회원가입/로그인 모달) -->
<div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
  <div class="auth-modal-card">
    <!-- Top Actions: Discreet Admin button & Close button -->
    <div class="auth-modal-top-actions">
      <button type="button" class="btn-discreet-admin" onclick="switchAuthTab('admin')" title="관리자 로그인">
        관리자
      </button>
      <button class="auth-modal-close" id="auth-modal-close" aria-label="닫기" onclick="closeAuthModal()">
        <i class="ph ph-x"></i>
      </button>
    </div>

    <div class="auth-modal-header text-center">
      <div class="auth-logo-badge">
        <img src="{{ "images/logo.png" | relURL }}" alt="해아림 로고" width="40" height="40">
      </div>
      <h3 id="auth-modal-title" class="auth-modal-title">해아림한의원 분당점</h3>
      <p class="auth-modal-notice">
        <i class="ph-bold ph-shield-check"></i> 의료법 제56조에 의거하여 실제 환자분의 치료후기 및 자필 수기는 <strong>로그인 후 열람</strong>하실 수 있습니다.
      </p>
    </div>

    <!-- 1. General Login View (기본 노출 화면) -->
    <div class="auth-view-panel" id="auth-view-login">
      <form class="auth-form" id="login-form" onsubmit="handleEmailLogin(event)">
        <div class="auth-input-group">
          <label for="login-email">아이디 또는 이메일</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-user"></i>
            <input type="text" id="login-email" placeholder="아이디 또는 이메일 입력" required autocomplete="username">
          </div>
        </div>

        <div class="auth-input-group">
          <label for="login-password">비밀번호</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-lock-key"></i>
            <input type="password" id="login-password" placeholder="비밀번호 입력" required autocomplete="current-password">
          </div>
        </div>

        <div class="auth-form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>로그인 상태 유지</span>
          </label>
        </div>

        <button type="submit" class="btn btn-auth-submit">
          <span>로그인하고 치료수기 열람하기</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>

      <div class="auth-divider" id="auth-divider">
        <span>또는 간편 로그인</span>
      </div>

      <div class="social-auth-group" id="social-auth-group">
        <button type="button" class="btn-social-auth naver-auth" onclick="handleSocialLogin('naver')">
          <span class="n-symbol-auth">N</span>
          <span class="social-text-full">네이버 아이디로 로그인</span>
          <span class="social-text-short">네이버로 로그인</span>
        </button>
        <button type="button" class="btn-social-auth kakao-auth" onclick="handleSocialLogin('kakao')">
          <i class="ph-fill ph-chat-circle-dots"></i>
          <span class="social-text-full">카카오 계정으로 로그인</span>
          <span class="social-text-short">카카오로 로그인</span>
        </button>
      </div>

      <div class="auth-switch-prompt">
        <span>아직 회원이 아니신가요?</span>
        <button type="button" class="btn-switch-link" onclick="switchAuthTab('signup')">회원가입</button>
      </div>
    </div>

    <!-- 2. Sign-up View (회원가입 화면) -->
    <div class="auth-view-panel" id="auth-view-signup" style="display: none;">
      <form class="auth-form" id="signup-form" onsubmit="handleEmailSignup(event)">
        <div class="auth-input-group">
          <label for="signup-name">이름 (실명)</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-user"></i>
            <input type="text" id="signup-name" placeholder="홍길동" required autocomplete="name">
          </div>
        </div>

        <div class="auth-input-group">
          <label for="signup-phone">휴대폰 번호</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-phone"></i>
            <input type="tel" id="signup-phone" placeholder="010-1234-5678" required autocomplete="tel">
          </div>
        </div>

        <div class="auth-input-group">
          <label for="signup-email">아이디 (이메일)</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-envelope-simple"></i>
            <input type="email" id="signup-email" placeholder="example@naver.com" required autocomplete="username">
          </div>
        </div>

        <div class="auth-input-group">
          <label for="signup-password">비밀번호 (6자리 이상)</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-lock-key"></i>
            <input type="password" id="signup-password" placeholder="비밀번호 설정" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="agree-terms" required checked>
            <span>[필수] 개인정보 수집 및 의료정보 열람 동의</span>
          </label>
        </div>

        <button type="submit" class="btn btn-auth-submit signup-submit">
          <span>회원가입 완료 &amp; 수기 열람</span>
          <i class="ph-bold ph-check"></i>
        </button>
      </form>

      <div class="auth-switch-prompt">
        <span>이미 회원이신가요?</span>
        <button type="button" class="btn-switch-link" onclick="switchAuthTab('login')">로그인으로 돌아가기</button>
      </div>
    </div>

    <!-- 3. Admin Dedicated Login View (관리자 로그인 화면) -->
    <div class="auth-view-panel" id="auth-view-admin" style="display: none;">
      <form class="auth-form" id="admin-login-form" onsubmit="handleDedicatedAdminLogin(event)">
        <div class="auth-input-group">
          <label for="admin-email">관리자 이메일</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-envelope-simple"></i>
            <input type="email" id="admin-email" placeholder="admin@healimbd.com" required autocomplete="username">
          </div>
        </div>

        <div class="auth-input-group">
          <label for="admin-direct-pwd">관리자 비밀번호</label>
          <div class="input-with-icon">
            <i class="ph-bold ph-lock-key"></i>
            <input type="password" id="admin-direct-pwd" placeholder="비밀번호를 입력해주세요" required autocomplete="current-password">
          </div>
        </div>

        <div id="admin-login-error" style="display: none; color: #DC2626; font-size: 0.85rem; margin-bottom: 12px; line-height: 1.4;"></div>

        <div class="auth-form-options">
          <p style="font-size: 0.84rem; color: #0369A1; margin: 0;">
            <i class="ph-bold ph-shield-check"></i> Firebase 인증 및 관리자 권한 확인 후 온라인문의 답변 및 관리 권한이 활성화됩니다.
          </p>
        </div>

        <button type="submit" id="admin-login-btn" class="btn btn-auth-submit" style="background: #0F172A;">
          <span>관리자 로그인</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>

      <div class="auth-switch-prompt">
        <button type="button" class="btn-switch-link" onclick="switchAuthTab('login')">
          <i class="ph-bold ph-arrow-left"></i> 일반 로그인으로 돌아가기
        </button>
      </div>
    </div>

    <div class="auth-modal-footer text-center">
      <p>가입 시 의료법 및 개인정보 보호법에 의거하여 안전하게 암호화 관리됩니다.</p>
    </div>
  </div>
  <div class="auth-modal-overlay" onclick="closeAuthModal()"></div>
</div>
