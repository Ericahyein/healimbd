<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ site.Title }}{{ else }}{{ site.Title }} | 분당 한방신경정신과·공황장애·불면증·틱장애·ADHD{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="keywords" content="{{ site.Params.keywords }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="해아림한의원 분당점 | 분당 한방신경정신과·공황장애·불면증·틱장애·ADHD">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:image" content="{{ "images/og-image.png" | absURL }}">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ .Permalink }}">
  <meta property="twitter:title" content="해아림한의원 분당점">
  <meta property="twitter:description" content="{{ site.Params.description }}">

  <!-- Fonts (Pretendard & Outfit) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons (Phosphor Icons) -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <!-- Main Stylesheet -->
  {{ $style := resources.Get "css/style.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalBusiness",
    "name": "해아림한의원 분당점",
    "image": "{{ "images/og-image.png" | absURL }}",
    "telephone": "031-716-8575",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "성남대로 331번길 3-3, 젤존타워 3차 405호",
      "addressLocality": "성남시 분당구",
      "addressRegion": "경기도",
      "addressCountry": "KR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 37.3678,
      "longitude": 127.1084
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Wednesday"],
        "opens": "10:00",
        "closes": "20:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Tuesday", "Friday"],
        "opens": "10:00",
        "closes": "19:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Saturday"],
        "opens": "09:00",
        "closes": "15:00"
      }
    ],
    "medicalSpecialty": [
      "Psychiatric",
      "Pediatric"
    ],
    "priceRange": "$$"
  }
  </script>
</head>
<body>
  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "floating_bar.html" . }}

  <!-- Scripts -->
  {{ $script := resources.Get "js/main.js" | resources.Minify }}
  <script src="{{ $script.RelPermalink }}"></script>
</body>
</html>
