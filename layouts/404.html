{{ define "main" }}
<script>
  // Instant redirect fallback for old reservation and treatments paths
  if (window.location.pathname.startsWith('/reservation') || window.location.pathname.startsWith('/treatments')) {
    window.location.replace("{{ "guide/" | relURL }}");
  }
</script>
<section class="error-404-section" style="padding: 100px 20px; text-align: center; min-height: 60vh; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
  <div class="container" style="max-width: 560px; background: #ffffff; padding: 48px 32px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
    <div style="font-size: 3.8rem; font-weight: 800; color: #1B8FD1; line-height: 1; margin-bottom: 16px; letter-spacing: -1px;">404</div>
    <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 12px;">페이지를 찾을 수 없습니다</h1>
    <p style="font-size: 0.95rem; color: #64748b; line-height: 1.6; margin-bottom: 28px;">
      요청하신 페이지의 주소가 잘못 입력되었거나,<br>변경 혹은 삭제되어 현재 사용하실 수 없습니다.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ "/" | relURL }}" style="display: inline-block; padding: 12px 24px; background: #1B8FD1; color: #ffffff; border-radius: 8px; font-weight: 700; text-decoration: none;">홈으로 이동</a>
      <a href="{{ "guide/" | relURL }}" style="display: inline-block; padding: 12px 24px; background: #e2e8f0; color: #0f172a; border-radius: 8px; font-weight: 600; text-decoration: none;">진료안내 바로가기</a>
    </div>
  </div>
</section>
{{ end }}
