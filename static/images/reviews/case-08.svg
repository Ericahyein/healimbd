      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg-grad-08)" />
  <circle cx="520" cy="80" r="140" fill="#ffffff" opacity="0.06" />
  <circle cx="80" cy="310" r="110" fill="#ffffff" opacity="0.04" />
  
  <rect x="40" y="40" width="520" height="300" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  
  <rect x="70" y="70" width="140" height="32" rx="16" fill="#ffffff" opacity="0.25" />
  <text x="140" y="91" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" text-anchor="middle">과민성대장 클리닉</text>
  
  <text x="70" y="150" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">과민성대장증후군 및 신경성 복통</text>
  <text x="70" y="185" fill="#D1FAE5" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600">장-뇌 축(Gut-Brain Axis) 안정 및 복부 긴장 완화</text>
  
  <line x1="70" y1="215" x2="530" y2="215" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  
