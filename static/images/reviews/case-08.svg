  <text x="70" y="278" fill="#A7F3D0" font-family="'Pretendard', sans-serif" font-size="14">치료 기간: 3개월 (온장건비탕 + 복부 온열 침구요법)</text>
  <text x="70" y="306" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700">치료 결과: 스트레스성 복통·배변 절박감 소실, 편안한 출퇴근</text>
