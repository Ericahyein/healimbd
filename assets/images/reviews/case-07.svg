<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bg-grad-07)" />
  <circle cx="530" cy="70" r="140" fill="#ffffff" opacity="0.06" />
  <circle cx="70" cy="320" r="110" fill="#ffffff" opacity="0.04" />
  
  <rect x="40" y="40" width="520" height="300" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  
  <rect x="70" y="70" width="120" height="32" rx="16" fill="#ffffff" opacity="0.25" />
  <text x="130" y="91" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" text-anchor="middle">다한증 클리닉</text>
  
  <text x="70" y="150" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">손발 다한증 및 긴장성 발한</text>
  <text x="70" y="185" fill="#E0F2FE" font-family="'Pretendard', sans-serif" font-size="18" font-weight="600">교감신경 과흥분 조절 및 체온조절 회복</text>
  
  <line x1="70" y1="215" x2="530" y2="215" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  
  <text x="70" y="250" fill="#BAE6FD" font-family="'Pretendard', sans-serif" font-size="14">환자 구분: 20대 대학생 (손발 다한증으로 시험·대인관계 불편)</text>
  <text x="70" y="278" fill="#BAE6FD" font-family="'Pretendard', sans-serif" font-size="14">치료 기간: 2.5개월 (청심지한탕 + 자율신경 조절 침치료)</text>
  <text x="70" y="306" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700">치료 결과: 긴장 시 땀 분비 70% 감소, 일상 악수 및 필기 편안화</text>
</svg>
